name: realtime_detection_app
description: "RealtimeDetectionApp - YOLOv11 TFLite realtime object detection"

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.10.5+9
  ffi: ^2.1.2
  path_provider: ^2.1.4
  yaml: ^3.1.2
  permission_handler: ^11.3.1
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.4.3
  google_sign_in: ^7.2.0
  connectivity_plus: ^6.1.5
  flutter_secure_storage: ^9.2.4
  fluttertoast: ^8.2.8
  package_info_plus: ^8.0.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  flutter_map_tile_caching: ^9.0.1
  url_launcher: ^6.3.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  shared_preferences: ^2.3.2
  geocoder_offline: ^0.2.1
  uuid: ^4.5.1
  image_picker: ^1.0.8
  file_picker: ^8.1.2
  html: ^0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
    - assets/data/
    - assets/data/au_localities.csv

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_image.png
